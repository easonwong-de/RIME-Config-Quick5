config_version: "2026.01.15"
schema_list:
  - schema: quick5
  - schema: quick5de
switcher:
  caption: 〔設定〕
  hotkeys:
    - Control+grave
    - Control+Shift+grave
    - F4
  save_options:
    - zh_trad
    - simplification
    - japan_shinjitai
  fold_options: false
  abbreviate_options: false
  option_list_separator: "／"
menu:
  page_size: 9
key_binder:
  bindings:
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/move_by_word_with_tab
      - key_bindings:/paging_with_minus_equal
      - key_bindings:/paging_with_comma_period
      - key_bindings:/numbered_mode_switch
recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"
ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear
