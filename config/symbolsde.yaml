config_version: "2026.01.15"
patch:
    punctuator/import_preset: symbolsde
    recognizer/patterns/punct: "^/([0-9]0?|[A-Za-z]+)$"
punctuator:
    full_shape:
        " ": { commit: "　" }
        ",": { commit: ， }
        ".": [。, ⋯⋯]
        "`": [《, 〈, «, ‹, "<", ｜, "|"]
        "~": [》, 〉, », ›, ">", "¦", "‖"]
        "&": [、, ／, "/", ÷, ｛, 〖, "{"]
        "-": [＼, '\']
        "_": { commit: ？ }
        "<": { commit: ； }
        ">": { commit: ： }
        "|": { pair: ["『", "』"] }
        "@": { pair: ["「", "」"] }
        "#": ["§", ・, ·]
        "+": ["`", ‵, ‶, ‷]
        "=": [′, ″, ‴, ⁗]
        "!": { commit: ！ }
        "\\": [＃, "#", №, ⌘]
        "%": [％, "%", ‰, ‱]
        "±": ["°", "℃", ℉]
        "$": ["€", "$", "£", "¥", "¢", "¤", ₩]
        "§": ["^", ＾]
        "^": [＆, "&"]
        "}": [＊, "*", ・, ·, ×, ※]
        "*": [（, ［, 〔, 【, 〖, "(", "["]
        "(": [）, ］, 〕, 】, 〗, ")", "]"]
        "/": [－, −, "-"]
        "?": ——
        "]": [＋, "+", ～, "~", ≈, ≋, ≃, ≅, ≇, ∽, ⋍, ≌]
        ")": [＝, "=", ≠, ｝, "}"]
        "'": [＠, "@"]
        ";": { commit: ö }
        "[": { commit: ü }
    half_shape:
