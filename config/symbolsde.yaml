config_version: "2026.01.17"
patch:
    punctuator/import_preset: symbolsde
    recognizer/patterns/punct: "^/([0-9]0?|[A-Za-z]+)$"
punctuator:
    full_shape:
        " ": { commit: "　" }
        ",": { commit: ， }
        ".": { commit: 。 }
        "`": [《, 〈, «, ‹, "<", ｜, "|"]
        "~": [》, 〉, », ›, ">", "¦", "‖"]
        "&": [、, ／, "/", ÷, ｛, "{"]
        "_": { commit: ？ }
        "<": { commit: ； }
        ">": { commit: ： }
        "|": { pair: ["『", "』"] }
        "@": { pair: ["「", "」"] }
        "-": [＼, '\']
        "#": ["§", ・, ·]
        "+": [｀, "`", ‵, ‶, ‷]
        "]": [＋, "+", ～, "~", ≈, ≋, ≃, ≅, ≇, ∽, ⋍, ≌]
        "!": { commit: ！ }
        "'": [＠, "@"]
        "\\": [＃, "#", №, ⌘]
        "%": [％, "%", ‰, ‱]
        "$": ["€", "$", "£", "¥", "¢", "¤", ₩]
        "§": ["^", ＾]
        "^": [＆, "&"]
        "}": [＊, "*", ・, ·, ×, ※]
        "*": [（, "(", 〔, 【, 〖, ［, "["]
        "(": [）, ")", 〕, 】, 〗, ］, "]"]
        "/": [－, −, "-"]
        "?": ——
        ")": [＝, "=", ≠, ｝, "}"]
        "=": [′, ″, ‴, ⁗]
        "±": ["°", "℃", "℉"]
        ";": { commit: ⋯⋯ }
        "[": { commit: ü }
        '"': { commit: Ä }
        ":": { commit: Ö }
        "{": { commit: Ü }
