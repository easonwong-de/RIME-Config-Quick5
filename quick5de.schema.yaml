# Rime schema
# encoding: utf-8

schema:
  schema_id: quick5de
  name: 德鍵速成
  version: "2026.01.15"
  author:
    - 倉頡作者：朱邦復先生
    - JACKCHAN000@GitHub
    - easonwong-de@GitHub
  description: RIME 速成輸入法
menu:
  page_size: 9
switches:
  - options: [zh_trad, simplification, japan_shinjitai]
    states: [傳統漢字, 规范汉字, 日本新字]
  - name: emoji_suggestion
    reset: 1
  - name: extended_charset
    reset: 1
engine:
  processors:
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - table_translator@custom_phrase
  filters:
    - simplifier
    - uniquifier
    - simplifier@emoji_suggestion
    - simplifier@japan_shinjitai
speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - derive/^([a-z]).+([a-z])$/$1$2/
translator:
  dictionary: quick5de.extended
  comment_format:
    - xform/z([a-z]*)/符：\U$1\E/
    - xlit|abcdefghijklmnopqrstuvwxy'|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜・|
    - xform/符：([^Z]*[ZY][^Z]*)/$1/
    - xform/(?<=符：)(.*)Z(.*)/$1@$2/
    - xform/(?<=符：)(.*)Y(.*)/$1Z$2/
    - xform/(?<=符：)(.*)@(.*)/$1Y$2/
    - xform/符：([A-Z]*)/符：\L$1\E/
  preedit_format:
    - xform/z([a-z]*)/符：\U$1\E/
    - xlit|abcdefghijklmnopqrstuvwxy'|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜・|
    - xform/(?<=符：)(.*)Z(.*)/$1@$2/
    - xform/(?<=符：)(.*)Y(.*)/$1Z$2/
    - xform/(?<=符：)(.*)@(.*)/$1Y$2/
    - xform/符：([A-Z]*)/符：\L$1\E/
custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 1
punctuator:
  import_preset: symbolsde
key_binder:
  import_preset: default
recognizer:
  import_preset: default
emoji_suggestion:
  opencc_config: emoji_eason.json
  option_name: emoji_suggestion
japan_shinjitai:
  opencc_config: t2jp.json
  option_name: japan_shinjitai
